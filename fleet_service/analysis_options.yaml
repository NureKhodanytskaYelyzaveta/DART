include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Вимога ЛР 3: виклик асинхронної операції без await має підсвічуватися.
    - unawaited_futures
    - discarded_futures
    - avoid_print
